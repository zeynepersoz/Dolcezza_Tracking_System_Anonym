{% extends "base.html" %}
{% block title %}{{ t('nav.settings') }}{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">

  <nav class="flex items-center gap-1 overflow-x-auto border-b border-slate-200">
    {% for slug, label in tabs %}
    <a href="/settings/{{ slug }}"
       class="px-3 py-2 text-sm whitespace-nowrap border-b-2 -mb-px
              {% if slug == section %}border-gls-dark text-slate-900 font-medium
              {% else %}border-transparent text-slate-500 hover:text-slate-800{% endif %}">
      {{ label }}
    </a>
    {% endfor %}
  </nav>

  {% if error %}
  <div class="text-rose-700 text-sm p-3 bg-rose-50 border border-rose-200 rounded-lg">{{ error }}</div>
  {% endif %}
  {% if ok %}
  <div class="text-emerald-700 text-sm p-3 bg-emerald-50 border border-emerald-200 rounded-lg">{{ ok }}</div>
  {% endif %}

  {% block section %}{% endblock %}
</div>
{% endblock %}
