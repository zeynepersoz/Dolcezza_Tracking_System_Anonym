<div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
  <div class="flex items-start gap-3">
    <svg class="w-6 h-6 text-emerald-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <div class="flex-1">
      <div class="font-semibold text-emerald-900">{{ t('labels.created') }}</div>
      <div class="text-sm text-emerald-800 mt-1">
        {{ t('field.channel') }}: <strong>{{ channel }}</strong> &middot;
        {{ t('field.tracking_no') }}: <span class="font-mono">{{ parcel_no }}</span>
        {% if reference %} &middot; {{ t('labels.reference') }}: <strong>{{ reference }}</strong>{% endif %}
      </div>
      <div class="mt-3 flex gap-2">
        <a href="/tracking?search={{ parcel_no }}" class="btn btn-secondary btn-sm">
          {{ t('labels.see_in_tracking') }}
        </a>
      </div>
    </div>
  </div>
</div>
